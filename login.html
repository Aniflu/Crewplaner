<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anmelden — Tour Crew Plan</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<script>
  window.POCKETBASE_URL = 'https://api.crewplanner.nyxlightwork.de';
  window.getNavUrl = function(filename) {
    const parts = window.location.pathname.split('/').filter(Boolean);
    if (parts.length >= 1 && !parts[0].includes('.')) {
      return '/' + parts[0] + '/' + filename;
    }
    return '/' + filename;
  };
</script>
<script src="js/auth-bootstrap.js?v=12"></script>
<script src="js/pb-login-bundle.js?v=1"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a2e;
    color: #c8cdd5;
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .login-wrap {
    width: 100%;
    max-width: 380px;
  }

  .login-brand {
    text-align: center;
    margin-bottom: 32px;
  }

  .login-brand h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.4rem;
    letter-spacing: .08em;
    color: #fff;
    line-height: 1;
  }

  .login-brand h1 span {
    color: #e8c84a;
  }

  .login-brand p {
    font-size: .65rem;
    color: #5a6070;
    margin-top: 6px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .login-version {
    font-size: .55rem;
    color: #3a4050;
    margin-top: 3px;
    letter-spacing: .08em;
  }

  .login-card {
    background: #12121f;
    border: 1px solid #2a2a40;
    border-radius: 8px;
    padding: 28px 28px 24px;
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: .6rem;
    color: #5a6070;
    letter-spacing: .06em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    background: #1a1a2e;
    border: 1px solid #2a2a40;
    border-radius: 4px;
    padding: 10px 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .75rem;
    color: #c8cdd5;
    outline: none;
    transition: border-color .15s;
  }

  .field input:focus {
    border-color: #e8c84a;
  }

  .btn-login {
    width: 100%;
    background: #e8c84a;
    color: #1a1a2e;
    border: none;
    border-radius: 4px;
    padding: 11px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .04em;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity .15s;
  }

  .btn-login:hover { opacity: .88; }
  .btn-login:disabled { opacity: .45; cursor: not-allowed; }

  .error-msg {
    background: rgba(232, 74, 74, .12);
    border: 1px solid rgba(232, 74, 74, .3);
    border-radius: 4px;
    padding: 9px 12px;
    font-size: .65rem;
    color: #e84a4a;
    margin-top: 14px;
    display: none;
  }

  .reset-link {
    display: block;
    text-align: center;
    margin-top: 16px;
    font-size: .6rem;
    color: #5a6070;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
    width: 100%;
  }

  .reset-link:hover { color: #e8c84a; }

  .toggle-link {
    display: block;
    text-align: center;
    margin-top: 14px;
    font-size: .6rem;
    color: #5a6070;
    cursor: pointer;
    text-decoration: none;
  }
  .toggle-link:hover { color: #e8c84a; }

  .invite-banner {
    background: #e8c84a;
    color: #1a1a2e;
    padding: 10px 14px;
    border-radius: 4px;
    margin-bottom: 16px;
    font-size: .68rem;
    text-align: center;
    display: none;
  }

  .success-msg {
    background: rgba(74, 232, 160, .1);
    border: 1px solid rgba(74, 232, 160, .25);
    border-radius: 4px;
    padding: 9px 12px;
    font-size: .65rem;
    color: #4ae8a0;
    margin-top: 14px;
    display: none;
  }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-brand">
    <h1>Tour<span>/</span>Crew</h1>
    <p>Personalplan · Anmelden</p>
    <div class="login-version">v0.17.1</div>
  </div>

  <div class="login-card">
    <div class="invite-banner" id="inviteBanner">Du wurdest zu einem Einsatz eingeladen. Bitte anmelden oder Konto erstellen.</div>

    <div id="loginWrap">
      <div class="field">
        <label for="email">E-Mail</label>
        <input type="email" id="email" placeholder="name@beispiel.de" autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Passwort</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn-login" id="btnLogin" onclick="doLogin()">Anmelden</button>
      <button class="reset-link" onclick="doPasswordReset()">Passwort vergessen?</button>
    </div>

    <div id="registerWrap" style="display:none">
      <div class="field">
        <label for="regEmail">E-Mail</label>
        <input type="email" id="regEmail" placeholder="name@beispiel.de" autocomplete="email">
      </div>
      <div class="field">
        <label for="regPw">Passwort</label>
        <input type="password" id="regPw" placeholder="Mindestens 8 Zeichen" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="regPwConfirm">Passwort bestätigen</label>
        <input type="password" id="regPwConfirm" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button class="btn-login" id="btnRegister" onclick="doRegister()">Konto erstellen</button>
    </div>

    <div id="resetBox" style="display:none">
      <div style="font-size:.6rem;color:#e8c84a;letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px;">Passwort festlegen</div>
      <div class="field">
        <label for="resetPw1">Neues Passwort</label>
        <input type="password" id="resetPw1" placeholder="Mindestens 8 Zeichen" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="resetPw2">Passwort wiederholen</label>
        <input type="password" id="resetPw2" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button class="btn-login" onclick="doConfirmReset()">Passwort speichern</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>
    <a href="#" class="toggle-link" id="toggleRegisterLink" onclick="toggleRegister(); return false;">Noch kein Konto? Registrieren</a>
  </div>
</div>

<script>
  const _resetToken = new URLSearchParams(window.location.search).get('token');
  if (_resetToken) {
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('loginWrap').style.display       = 'none';
      document.getElementById('registerWrap').style.display    = 'none';
      document.getElementById('toggleRegisterLink').style.display = 'none';
      document.getElementById('resetBox').style.display        = 'block';
    });
  }

  async function doConfirmReset() {
    const pw1 = document.getElementById('resetPw1').value;
    const pw2 = document.getElementById('resetPw2').value;
    const err = document.getElementById('errorMsg');
    err.style.display = 'none';
    if (pw1.length < 8) { err.textContent = 'Mindestens 8 Zeichen.'; err.style.display = 'block'; return; }
    if (pw1 !== pw2)    { err.textContent = 'Passwörter stimmen nicht überein.'; err.style.display = 'block'; return; }
    try {
      await pbPost('/api/collections/users/confirm-password-reset', {
        token: _resetToken, password: pw1, passwordConfirm: pw2
      });
      document.getElementById('resetBox').style.display        = 'none';
      document.getElementById('loginWrap').style.display       = 'block';
      document.getElementById('toggleRegisterLink').style.display = 'block';
      document.getElementById('successMsg').textContent = 'Passwort gesetzt ✓ — bitte einloggen.';
      document.getElementById('successMsg').style.display = 'block';
      window.history.replaceState({}, '', window.location.pathname);
    } catch(e) {
      err.textContent = 'Fehler: ' + (e.message || 'Token abgelaufen oder ungültig.');
      err.style.display = 'block';
    }
  }

  function _redirectAfterAuth() {
    const pending = localStorage.getItem('pendingEmailAction');
    localStorage.removeItem('pendingEmailAction');
    const user = JSON.parse(localStorage.getItem('pb_user') || '{}');
    const base = user.role === 'superadmin' ? 'admin.html' : 'index.html';
    window.location.href = window.getNavUrl(base) + (pending || '');
  }

  // Show invite banner if user was invited (auth-bootstrap.js handles token validation)
  (function() {
    if (localStorage.getItem('pendingEmailAction')) {
      document.getElementById('inviteBanner').style.display = 'block';
    }
  })();

  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  function toggleRegister() {
    const showReg = document.getElementById('registerWrap').style.display === 'none';
    document.getElementById('registerWrap').style.display = showReg ? 'block' : 'none';
    document.getElementById('loginWrap').style.display = showReg ? 'none' : 'block';
    document.getElementById('toggleRegisterLink').textContent = showReg
      ? 'Bereits registriert? Anmelden'
      : 'Noch kein Konto? Registrieren';
    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('successMsg').style.display = 'none';
  }

  async function doLogin() {
    const email    = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btnLogin');

    document.getElementById('errorMsg').style.display  = 'none';
    document.getElementById('successMsg').style.display = 'none';

    if (!email || !password) { showError('Bitte E-Mail und Passwort eingeben.'); return; }

    btn.disabled = true;
    btn.textContent = 'Anmelden…';

    try {
      const data = await pbPost('/api/collections/users/auth-with-password', {
        identity: email, password
      });
      localStorage.setItem('pb_token', data.token);
      localStorage.setItem('pb_user', JSON.stringify(data.record));
      btn.textContent = 'Weiterleiten…';
      _redirectAfterAuth();
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Anmelden';
      showError(_translateError(e.message));
    }
  }

  async function doRegister() {
    const email = (document.getElementById('regEmail')?.value || '').trim().toLowerCase();
    const password = document.getElementById('regPw')?.value || '';
    const passwordConfirm = document.getElementById('regPwConfirm')?.value || '';
    document.getElementById('errorMsg').style.display = 'none';
    if (!email || !password) { showError('Bitte alle Felder ausfüllen.'); return; }
    if (password !== passwordConfirm) { showError('Passwörter stimmen nicht überein.'); return; }
    if (password.length < 8) { showError('Passwort muss mindestens 8 Zeichen lang sein.'); return; }
    const btn = document.getElementById('btnRegister');
    btn.disabled = true;
    btn.textContent = 'Konto wird erstellt…';
    try {
      // role:'crew' → sonst leere Rolle = IS_CREW false = kein Plan; emailVisibility:true →
      // sonst „Keine E-Mail" in der Admin-Liste. (Admin-Anlage-Pfade setzen beides schon.)
      await pbPost('/api/collections/users/records', { email, password, passwordConfirm, role: 'crew', emailVisibility: true });
      const auth = await pbPost('/api/collections/users/auth-with-password', { identity: email, password });
      localStorage.setItem('pb_token', auth.token);
      localStorage.setItem('pb_user', JSON.stringify(auth.record));
      btn.textContent = 'Weiterleiten…';
      _redirectAfterAuth();
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Konto erstellen';
      showError('Registrierung fehlgeschlagen: ' + (e.message || 'Unbekannter Fehler'));
    }
  }

  async function doPasswordReset() {
    const email = document.getElementById('email').value.trim();
    if (!email) { showError('Bitte zuerst E-Mail-Adresse eingeben.'); return; }
    try {
      await pbPost('/api/collections/users/request-password-reset', { email });
      document.getElementById('successMsg').textContent = 'Reset-Link wurde an ' + email + ' gesendet.';
      document.getElementById('successMsg').style.display = 'block';
    } catch (e) {
      showError('Fehler beim Senden des Reset-Links.');
    }
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function _translateError(msg) {
    if (msg.includes('Failed to authenticate') || msg.includes('Invalid credentials'))
      return 'E-Mail oder Passwort falsch.';
    if (msg.includes('Too many requests')) return 'Zu viele Versuche. Bitte kurz warten.';
    return msg;
  }
</script>
</body>
</html>
