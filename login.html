<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anmelden — Tour Crew Plan</title>
<script>
  // Service Worker: hält Module/Seiten dauerhaft aktuell (siehe sw.js).
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
    var _swReloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (_swReloaded) return; _swReloaded = true; location.reload();
    });
  }
</script>
<script>try{var _m=localStorage.getItem('cp_mode');if(_m==='light'||_m==='dark')document.documentElement.dataset.theme=_m;}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="theme.css?v=3">
<script>
  // Umgebungs-Auswahl (v0.31.0): nur der exakte Live-Host bekommt die Live-API,
  // GitHub Pages / localhost / sonst → Test-API. Wortgleich zu pickApiUrl in js/pure.js.
  window.POCKETBASE_URL = (function (h) {
    if (h === 'crewplanner.nyxlightwork.de' || h === 'www.crewplanner.nyxlightwork.de')
      return 'https://api.crewplanner.nyxlightwork.de';
    return 'https://api-test.crewplanner.nyxlightwork.de';
  })(location.hostname);
  window.getNavUrl = function(filename) {
    const parts = window.location.pathname.split('/').filter(Boolean);
    if (parts.length >= 1 && !parts[0].includes('.')) {
      return '/' + parts[0] + '/' + filename;
    }
    return '/' + filename;
  };
</script>
<script src="js/auth-bootstrap.js?v=12"></script>
<script src="js/pb-login-bundle.js?v=3"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Spaltenrichtung statt Zeile: sonst setzt der Flex-Container den Rechts-Footer NEBEN die
     Anmeldekarte. Die Karte bleibt trotzdem mittig — `margin:auto` verteilt den freien Raum
     gleichmäßig über und unter ihr, der Footer schließt darunter ab. */
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 20px 0;
  }

  .login-wrap {
    width: 100%;
    max-width: 380px;
    margin: auto;
  }

  /* Der Footer spannt über die volle Breite und braucht hier kein margin-top:auto —
     das übernimmt bereits das margin:auto der Karte. */
  body > .legal-footer {
    width: calc(100% + 40px);
    margin: 0 -20px;
  }

  .login-brand {
    text-align: center;
    margin-bottom: 32px;
  }

  .login-brand h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.4rem;
    letter-spacing: .08em;
    color: #fff;
    line-height: 1;
  }

  .login-brand h1 span {
    color: var(--accent);
  }

  .login-brand p {
    font-size: .65rem;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .login-version {
    font-size: .55rem;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: .08em;
  }

  .login-card {
    background: var(--panel);
    border: 1px solid var(--rule-2);
    border-radius: 8px;
    padding: 28px 28px 24px;
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: .6rem;
    color: var(--muted);
    letter-spacing: .06em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--rule-2);
    border-radius: 4px;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: .75rem;
    color: var(--ink);
    outline: none;
    transition: border-color .15s;
  }

  .field input:focus {
    border-color: var(--accent);
  }

  .btn-login {
    width: 100%;
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: 4px;
    padding: 11px;
    font-family: var(--sans);
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .04em;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity .15s;
  }

  .btn-login:hover { opacity: .88; }
  .btn-login:disabled { opacity: .45; cursor: not-allowed; }

  .error-msg {
    background: rgba(232, 74, 74, .12);
    border: 1px solid rgba(232, 74, 74, .3);
    border-radius: 4px;
    padding: 9px 12px;
    font-size: .65rem;
    color: var(--warn);
    margin-top: 14px;
    display: none;
  }

  .reset-link {
    display: block;
    text-align: center;
    margin-top: 16px;
    font-size: .6rem;
    color: var(--muted);
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
    width: 100%;
  }

  .reset-link:hover { color: var(--accent); }

  .toggle-link {
    display: block;
    text-align: center;
    margin-top: 14px;
    font-size: .6rem;
    color: var(--muted);
    cursor: pointer;
    text-decoration: none;
  }
  .toggle-link:hover { color: var(--accent); }

  .invite-banner {
    background: var(--accent);
    color: var(--on-accent);
    padding: 10px 14px;
    border-radius: 4px;
    margin-bottom: 16px;
    font-size: .68rem;
    text-align: center;
    display: none;
  }

  .success-msg {
    background: rgba(74, 232, 160, .1);
    border: 1px solid rgba(74, 232, 160, .25);
    border-radius: 4px;
    padding: 9px 12px;
    font-size: .65rem;
    color: var(--show);
    margin-top: 14px;
    display: none;
  }
</style>
</head>
<body>

<div class="login-wrap">
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Hell/Dunkel umschalten" aria-label="Hell/Dunkel umschalten" style="position:fixed;top:16px;right:16px;">☾</button>
  <div class="login-brand">
    <svg class="cp-mark" width="60" height="60" viewBox="0 0 56 56" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" style="margin:0 auto 14px;" aria-label="Crewplanner">
      <path d="M28 3 L49 14 L49 42 L28 53 L7 42 L7 14 Z" stroke="currentColor"/>
      <rect x="18" y="16" width="20" height="26" rx="2.4" stroke="currentColor"/>
      <rect x="24" y="13.5" width="8" height="5" rx="1.2" stroke="currentColor"/>
      <circle cx="28" cy="26" r="4" fill="#f7c948" stroke="none"/>
      <path d="M21.5 37 v-1 a6.5 6.5 0 0 1 13 0 v1" stroke="currentColor"/>
    </svg>
    <h1 style="font-family:var(--sans);font-weight:700;font-size:1.9rem;letter-spacing:-.03em;color:var(--ink);text-transform:none;">Crewplanner</h1>
    <p>Personalplanung · Touring</p>
    <div class="login-version">v0.10.4</div>
  </div>

  <div class="login-card">
    <div class="invite-banner" id="inviteBanner">Du wurdest zu einem Einsatz eingeladen. Bitte anmelden oder Konto erstellen.</div>

    <div id="loginWrap">
      <div class="field">
        <label for="email">E-Mail</label>
        <input type="email" id="email" placeholder="name@beispiel.de" autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Passwort</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn-login" id="btnLogin" onclick="doLogin()">Anmelden</button>
      <button class="reset-link" onclick="doPasswordReset()">Passwort vergessen?</button>
    </div>

    <div id="registerWrap" style="display:none">
      <div class="field">
        <label for="regEmail">E-Mail</label>
        <input type="email" id="regEmail" placeholder="name@beispiel.de" autocomplete="email">
      </div>
      <div class="field">
        <label for="regPw">Passwort</label>
        <input type="password" id="regPw" placeholder="Mindestens 8 Zeichen" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="regPwConfirm">Passwort bestätigen</label>
        <input type="password" id="regPwConfirm" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button class="btn-login" id="btnRegister" onclick="doRegister()">Konto erstellen</button>
    </div>

    <div id="resetBox" style="display:none">
      <div style="font-size:.6rem;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px;">Passwort festlegen</div>
      <div class="field">
        <label for="resetPw1">Neues Passwort</label>
        <input type="password" id="resetPw1" placeholder="Mindestens 8 Zeichen" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="resetPw2">Passwort wiederholen</label>
        <input type="password" id="resetPw2" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button class="btn-login" onclick="doConfirmReset()">Passwort speichern</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>
    <a href="#" class="toggle-link" id="toggleRegisterLink" onclick="toggleRegister(); return false;">Noch kein Konto? Registrieren</a>
  </div>
</div>

<script>
  const _resetToken = new URLSearchParams(window.location.search).get('token');
  if (_resetToken) {
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('loginWrap').style.display       = 'none';
      document.getElementById('registerWrap').style.display    = 'none';
      document.getElementById('toggleRegisterLink').style.display = 'none';
      document.getElementById('resetBox').style.display        = 'block';
    });
  }

  async function doConfirmReset() {
    const pw1 = document.getElementById('resetPw1').value;
    const pw2 = document.getElementById('resetPw2').value;
    const err = document.getElementById('errorMsg');
    err.style.display = 'none';
    if (pw1.length < 8) { err.textContent = 'Mindestens 8 Zeichen.'; err.style.display = 'block'; return; }
    if (pw1 !== pw2)    { err.textContent = 'Passwörter stimmen nicht überein.'; err.style.display = 'block'; return; }
    try {
      await pbPost('/api/collections/users/confirm-password-reset', {
        token: _resetToken, password: pw1, passwordConfirm: pw2
      });
      document.getElementById('resetBox').style.display        = 'none';
      document.getElementById('loginWrap').style.display       = 'block';
      document.getElementById('toggleRegisterLink').style.display = 'block';
      document.getElementById('successMsg').textContent = 'Passwort gesetzt ✓ — bitte einloggen.';
      document.getElementById('successMsg').style.display = 'block';
      window.history.replaceState({}, '', window.location.pathname);
    } catch(e) {
      err.textContent = 'Fehler: ' + (e.message || 'Token abgelaufen oder ungültig.');
      err.style.display = 'block';
    }
  }

  function _redirectAfterAuth() {
    const pending = localStorage.getItem('pendingEmailAction');
    localStorage.removeItem('pendingEmailAction');
    const user = JSON.parse(localStorage.getItem('pb_user') || '{}');
    const base = user.role === 'superadmin' ? 'admin.html' : 'index.html';
    window.location.href = window.getNavUrl(base) + (pending || '');
  }

  // Show invite banner if user was invited (auth-bootstrap.js handles token validation)
  (function() {
    if (localStorage.getItem('pendingEmailAction')) {
      document.getElementById('inviteBanner').style.display = 'block';
    }
  })();

  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  function toggleRegister() {
    const showReg = document.getElementById('registerWrap').style.display === 'none';
    document.getElementById('registerWrap').style.display = showReg ? 'block' : 'none';
    document.getElementById('loginWrap').style.display = showReg ? 'none' : 'block';
    document.getElementById('toggleRegisterLink').textContent = showReg
      ? 'Bereits registriert? Anmelden'
      : 'Noch kein Konto? Registrieren';
    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('successMsg').style.display = 'none';
  }

  async function doLogin() {
    const email    = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btnLogin');

    document.getElementById('errorMsg').style.display  = 'none';
    document.getElementById('successMsg').style.display = 'none';

    if (!email || !password) { showError('Bitte E-Mail und Passwort eingeben.'); return; }

    btn.disabled = true;
    btn.textContent = 'Anmelden…';

    try {
      const data = await pbPost('/api/collections/users/auth-with-password', {
        identity: email, password
      });
      localStorage.setItem('pb_token', data.token);
      localStorage.setItem('pb_user', JSON.stringify(data.record));
      btn.textContent = 'Weiterleiten…';
      _redirectAfterAuth();
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Anmelden';
      showError(_translateError(e.message));
    }
  }

  async function doRegister() {
    const email = (document.getElementById('regEmail')?.value || '').trim().toLowerCase();
    const password = document.getElementById('regPw')?.value || '';
    const passwordConfirm = document.getElementById('regPwConfirm')?.value || '';
    document.getElementById('errorMsg').style.display = 'none';
    if (!email || !password) { showError('Bitte alle Felder ausfüllen.'); return; }
    if (password !== passwordConfirm) { showError('Passwörter stimmen nicht überein.'); return; }
    if (password.length < 8) { showError('Passwort muss mindestens 8 Zeichen lang sein.'); return; }
    const btn = document.getElementById('btnRegister');
    btn.disabled = true;
    btn.textContent = 'Konto wird erstellt…';
    try {
      // role:'crew' als DEFAULT → sonst leere Rolle = IS_CREW false = kein Plan; emailVisibility:true
      // → sonst „Keine E-Mail" in der Admin-Liste. Hat der Admin die Person im globalen Crew-Pool
      // (crew_members plan_id="__pool__") mit einer anderen Rolle angelegt, überschreibt der
      // users-Create-Hook (main.pb.js v4.8) die Rolle serverseitig. Client kann users.role nicht
      // selbst setzen (updateRule = superadmin).
      await pbPost('/api/collections/users/records', { email, password, passwordConfirm, role: 'crew', emailVisibility: true });
      const auth = await pbPost('/api/collections/users/auth-with-password', { identity: email, password });
      localStorage.setItem('pb_token', auth.token);
      localStorage.setItem('pb_user', JSON.stringify(auth.record));
      btn.textContent = 'Weiterleiten…';
      _redirectAfterAuth();
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Konto erstellen';
      // E-Mail schon vergeben (z.B. vom Admin vorab angelegtes Konto) → KEIN neues Konto,
      // sondern in den Login umschalten. Sonst sieht der User nur „Failed to create record".
      // ZUERST prüfen: das ist der spezifischere Fall (PB liefert einen Feld-Grund).
      const emailTaken = (e && e.data && e.data.email && e.data.email.code === 'validation_not_unique')
                      || /already in use|must be unique|not_unique/i.test((e && e.message) || '');
      if (emailTaken) {
        _switchToLogin(email);
        showError('Konto mit dieser E-Mail-Adresse schon vorhanden. Bitte melde dich unten an — oder klicke „Passwort vergessen?", falls du noch kein Passwort hast.');
        return;
      }
      // Adresse nicht freigegeben (v0.5.1): Ein Konto entsteht nur, wenn der Planer die
      // Adresse vorher angelegt hat. Abgewiesen wird server-seitig auf zwei Wegen:
      //  • createRule (greift ZUERST, in der Praxis der Normalfall): HTTP 400,
      //    `message` generisch „Failed to create record.", `data` LEER — am echten
      //    Backend verifiziert. Das leere `data` ist der Unterscheider: Feldfehler wie
      //    die Dublette oben liefern immer einen Grund in `data`.
      //  • Hook v4.13 (falls die Regel mal fehlt, z.B. nach einem Coolify-Redeploy):
      //    Kennung `not_allowlisted` in der Meldung.
      const emptyData = !e?.data || Object.keys(e.data).length === 0;
      const notAllowed = /not_allowlisted/i.test((e && e.message) || '')
                      || e?.status === 403
                      || (e?.status === 400 && emptyData);
      if (notAllowed) {
        showError('Diese E-Mail-Adresse ist nicht freigegeben. Bitte wende dich an deinen Planer.');
        return;
      }
      showError('Registrierung fehlgeschlagen: ' + (e.message || 'Unbekannter Fehler'));
    }
  }

  // In den Login-Bereich wechseln + E-Mail vorbefüllen (nach „E-Mail bereits vergeben").
  function _switchToLogin(prefillEmail) {
    document.getElementById('registerWrap').style.display = 'none';
    document.getElementById('loginWrap').style.display    = 'block';
    document.getElementById('toggleRegisterLink').textContent = 'Noch kein Konto? Registrieren';
    if (prefillEmail) document.getElementById('email').value = prefillEmail;
    document.getElementById('successMsg').style.display = 'none';
  }

  async function doPasswordReset() {
    const email = document.getElementById('email').value.trim();
    if (!email) { showError('Bitte zuerst E-Mail-Adresse eingeben.'); return; }
    try {
      await pbPost('/api/collections/users/request-password-reset', { email });
      document.getElementById('successMsg').textContent = 'Reset-Link wurde an ' + email + ' gesendet.';
      document.getElementById('successMsg').style.display = 'block';
    } catch (e) {
      showError('Fehler beim Senden des Reset-Links.');
    }
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function _translateError(msg) {
    if (msg.includes('Failed to authenticate') || msg.includes('Invalid credentials'))
      return 'E-Mail oder Passwort falsch.';
    if (msg.includes('Too many requests')) return 'Zu viele Versuche. Bitte kurz warten.';
    return msg;
  }
</script>
<script>
  // Hell/Dunkel-Umschalter (data-theme am <html>, Schlüssel cp_mode). Login lädt app.js nicht.
  (function(){
    function mode(){return document.documentElement.dataset.theme||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}
    function paint(){var b=document.getElementById('themeToggle');if(!b)return;var d=mode()==='dark';b.textContent=d?'☀':'☾';b.title=d?'Auf Hell umschalten':'Auf Dunkel umschalten';}
    window.toggleTheme=function(){var n=mode()==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('cp_mode',n);}catch(e){}paint();};
    paint();
  })();
</script>
