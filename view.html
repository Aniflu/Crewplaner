<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tour Plan — Ansicht</title>
<script>
  // Service Worker: hält Module/Seiten dauerhaft aktuell (siehe sw.js).
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
    var _swReloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (_swReloaded) return; _swReloaded = true; location.reload();
    });
  }
</script>
<script>try{var _m=localStorage.getItem('cp_mode');if(_m==='light'||_m==='dark')document.documentElement.dataset.theme=_m;}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="theme.css?v=1">
<link rel="stylesheet" href="styles.css?v=24">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); min-height: 100vh; }
.view-header {
  display: flex; align-items: center; gap: 16px;
  padding: 18px 24px; border-bottom: 1px solid var(--rule-2);
  background: var(--panel);
}
.view-header-title { font-size: 1.1rem; font-weight: 600; color: var(--ink); letter-spacing: .05em; }
.view-header-sub { font-size: .6rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 2px; }
.view-badge {
  margin-left: auto; font-size: .55rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); background: var(--panel2); border: 1px solid var(--rule-2); border-radius: 2px;
  padding: 4px 10px;
}
.table-wrap { overflow-x: auto; padding: 0; }
#viewError {
  display: none; padding: 48px 24px; text-align: center;
  font-size: .75rem; color: var(--warn); letter-spacing: .05em;
}
#viewLoading {
  padding: 48px 24px; text-align: center;
  font-size: .7rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
}
/* Toast stub */
#toast { display: none; }
/* Hide elements that require interaction */
.cell-dd, .dd-wrap { pointer-events: none; }
</style>
</head>
<body>

<div class="view-header">
  <svg class="cp-mark" width="30" height="30" viewBox="0 0 56 56" fill="none" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="color:var(--ink);" aria-label="Crewplanner">
    <path d="M28 3 L49 14 L49 42 L28 53 L7 42 L7 14 Z" stroke="currentColor"/>
    <rect x="18" y="16" width="20" height="26" rx="2.4" stroke="currentColor"/>
    <rect x="24" y="13.5" width="8" height="5" rx="1.2" stroke="currentColor"/>
    <circle cx="28" cy="26" r="4" fill="#f7c948" stroke="none"/>
    <path d="M21.5 37 v-1 a6.5 6.5 0 0 1 13 0 v1" stroke="currentColor"/>
  </svg>
  <div>
    <div class="view-header-title" id="viewPlanName">Tour Plan</div>
    <div class="view-header-sub">Crewplanner · Read-only</div>
  </div>
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Hell/Dunkel umschalten" aria-label="Hell/Dunkel umschalten" style="margin-left:auto;">☾</button>
  <div class="view-badge" style="margin-left:12px;">Ansicht</div>
</div>

<div id="viewLoading">Plan wird geladen…</div>
<div id="viewError"></div>

<!-- Benötigte Stubs für render.js -->
<div id="viewTable">
  <div class="table-wrap">
    <table>
      <thead id="tHead"></thead>
      <tbody id="tBody"></tbody>
    </table>
  </div>
</div>
<div id="viewBlocks" style="display:none;"></div>
<div id="viewCrew" style="display:none;"></div>
<div id="viewMeta" style="display:none;"></div>
<div id="statsBar" style="display:none;"></div>
<div id="toast"></div>

<script type="module" src="js/view-app.js?v=3"></script>
</body>
</html>
