# nginx-Konfiguration des Live-Frontends (wird vom Dockerfile nach
# /etc/nginx/conf.d/default.conf kopiert).
#
# Audit-Befund W-2 (docs/audit-2026-08-09.md): Gemessen am 2026-08-09 UND erneut am 2026-08-11
# lieferte crewplanner.nyxlightwork.de NICHT EINEN Schutz-Header:
#
#     $ curl -sI https://crewplanner.nyxlightwork.de/
#     server: nginx/1.31.3
#
# Die API setzt immerhin zwei (nosniff, SAMEORIGIN) — ausgerechnet das Frontend, wo der Browser
# den Code ausführt und wo das Anmelde-Token liegt, keinen.

server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # ── Schutz-Header ────────────────────────────────────────────────────────────────
    # `always` ist Pflicht: ohne das Schlüsselwort setzt nginx den Header NUR bei 2xx/3xx,
    # und ausgerechnet Fehlerseiten gingen ungeschützt raus.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header X-Frame-Options           "DENY"        always;
    add_header Referrer-Policy           "no-referrer" always;

    # ── Content-Security-Policy ──────────────────────────────────────────────────────
    # Aktiv seit v0.8.4. Sie kam bewusst einen Schritt NACH der Auslieferungsbegrenzung und den
    # vier Headern oben — bricht etwas, ist die Ursache damit eindeutig und nicht eine von drei
    # gleichzeitigen Änderungen.
    #
    # ⚠️ NICHT KÜRZEN — jede Direktive hat einen konkreten Grund:
    #   connect-src  die eigentliche Schutzwirkung: eine XSS-Lücke könnte das Token aus dem
    #                localStorage (Befund W-4) nicht mehr an einen fremden Server schicken
    #   font-src     assets/fonts/*.woff2 (Geist, JetBrains Mono, Archivo, IBM Plex Mono) —
    #                seit v0.8.4 ALLE selbst gehostet, es geht nichts mehr an Google
    #   img-src data: die Kunden-Logos liegen als Base64 in tourplan_logos
    #   worker-src   sw.js
    #   unsafe-inline bewusster Kompromiss: die App lebt von onclick=-Handlern (allein
    #                index.html hat 87) und Inline-<style>. Es zu entfernen hieße, alle vier
    #                Oberflächen umzubauen. 'unsafe-eval' braucht es NICHT — kein eval,
    #                kein new Function im Code; das bitte so lassen.
    #
    # Geprüft wird sie von tests/delivery.test.mjs (aktiv, nicht auskommentiert — der teure
    # Fehler ist die Datei, die richtig aussieht, während der Header fehlt).
    # Lokal erproben: node tools/serve-csp.mjs
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.crewplanner.nyxlightwork.de; img-src 'self' data:; font-src 'self'; worker-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
