# nginx-Konfiguration des Live-Frontends (wird vom Dockerfile nach
# /etc/nginx/conf.d/default.conf kopiert).
#
# Audit-Befund W-2 (docs/audit-2026-08-09.md): Gemessen am 2026-08-09 UND erneut am 2026-08-11
# lieferte crewplanner.nyxlightwork.de NICHT EINEN Schutz-Header:
#
#     $ curl -sI https://crewplanner.nyxlightwork.de/
#     server: nginx/1.31.3
#
# Die API setzt immerhin zwei (nosniff, SAMEORIGIN) — ausgerechnet das Frontend, wo der Browser
# den Code ausführt und wo das Anmelde-Token liegt, keinen.

server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # ── Schutz-Header ────────────────────────────────────────────────────────────────
    # `always` ist Pflicht: ohne das Schlüsselwort setzt nginx den Header NUR bei 2xx/3xx,
    # und ausgerechnet Fehlerseiten gingen ungeschützt raus.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header X-Frame-Options           "DENY"        always;
    add_header Referrer-Policy           "no-referrer" always;

    # ── Content-Security-Policy ──────────────────────────────────────────────────────
    # Kommt bewusst ERST IM ZWEITEN PUSH dazu (siehe docs/admin-runbook-auslieferung-v0.8.2.md).
    # Grund: Für diese Datei gibt es keine Testumgebung — Test ist GitHub Pages, dort lässt sich
    # kein Header erproben. Die Auslieferungsbegrenzung und die vier Header oben werden also
    # zuerst allein scharfgeschaltet und gemessen; bricht danach etwas, ist die CSP die Ursache
    # und nicht eine von drei Änderungen gleichzeitig.
    #
    # ⚠️ Beim Aktivieren NICHT kürzen — jede Direktive hier hat einen konkreten Grund:
    #   connect-src  die eigentliche Schutzwirkung: eine XSS-Lücke könnte das Token aus dem
    #                localStorage (Befund W-4) nicht mehr an einen fremden Server schicken
    #   font-src     assets/fonts/*.woff2 (Geist, JetBrains Mono) — sonst Systemschrift
    #   img-src data: die Kunden-Logos liegen als Base64 in tourplan_logos
    #   worker-src   sw.js
    #   unsafe-inline bewusster Kompromiss: die App lebt von onclick=-Handlern und Inline-<style>.
    #                Es zu entfernen hieße, index/admin/login/view.html umzubauen.
    #
    # add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.crewplanner.nyxlightwork.de; img-src 'self' data:; font-src 'self'; worker-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
