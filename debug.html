<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crewplaner Debug Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e;
      color: #c8cdd5;
      font-family: 'IBM Plex Mono', monospace;
      display: flex;
      height: 100vh;
    }
    .sidebar {
      width: 300px;
      background: #0f0f23;
      border-right: 1px solid #2a2a3e;
      padding: 20px;
      overflow-y: auto;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .controls {
      background: #151530;
      padding: 15px;
      border-bottom: 1px solid #2a2a3e;
      display: flex;
      gap: 10px;
    }
    .logs {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      background: #1a1a2e;
    }
    .log-entry {
      padding: 8px;
      margin: 5px 0;
      border-radius: 4px;
      border-left: 3px solid #e8c84a;
      font-size: 11px;
      background: #0f0f23;
    }
    .log-entry.ERROR { border-left-color: #e84a4a; }
    .log-entry.WARN { border-left-color: #f0d860; }
    .log-entry.LOG { border-left-color: #4ae8a0; }
    .log-entry.REDIRECT { border-left-color: #6495ed; background: #1a1a3e; }
    .log-entry.STORAGE { border-left-color: #c9a0dc; }
    .timestamp { color: #5a6070; font-size: 10px; }
    .level { font-weight: bold; margin-right: 8px; }
    button {
      padding: 8px 12px;
      background: #e8c84a;
      color: #1a1a2e;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #f0d860; }
    .badge {
      display: inline-block;
      background: #e8c84a;
      color: #1a1a2e;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      margin-left: 5px;
    }
    h3 { margin-top: 15px; margin-bottom: 8px; font-size: 12px; color: #e8c84a; }
    .stat { font-size: 12px; margin: 4px 0; }
    .stat-value { color: #4ae8a0; font-weight: bold; }
  </style>
</head>
<body>

<div class="sidebar">
  <h2>Debug Dashboard</h2>
  <p style="font-size: 11px; color: #5a6070; margin: 8px 0;">Alle Logs von der Website live</p>

  <h3>Status</h3>
  <div class="stat">Logs: <span class="stat-value" id="logCount">0</span></div>
  <div class="stat">Redirects: <span class="stat-value" id="redirectCount">0</span></div>
  <div class="stat">Errors: <span class="stat-value" id="errorCount">0</span></div>
  <div class="stat">Warnings: <span class="stat-value" id="warnCount">0</span></div>

  <h3>Filter</h3>
  <label style="display: block; margin: 5px 0;">
    <input type="checkbox" id="filterLog" checked> LOG
  </label>
  <label style="display: block; margin: 5px 0;">
    <input type="checkbox" id="filterError" checked> ERROR
  </label>
  <label style="display: block; margin: 5px 0;">
    <input type="checkbox" id="filterWarn" checked> WARN
  </label>
  <label style="display: block; margin: 5px 0;">
    <input type="checkbox" id="filterRedirect" checked> REDIRECT
  </label>
</div>

<div class="main">
  <div class="controls">
    <button onclick="clearLogs()">🗑️ Clear Logs</button>
    <button onclick="copyToClipboard()">📋 Copy All</button>
    <button onclick="downloadLogs()">⬇️ Download</button>
  </div>
  <div class="logs" id="logsContainer"></div>
</div>

<script>
  const logs = [];

  // Capture console methods
  const originalLog = console.log;
  const originalError = console.error;
  const originalWarn = console.warn;

  function addLog(level, ...args) {
    const message = args.map(arg => {
      if (typeof arg === 'object') {
        try {
          return JSON.stringify(arg);
        } catch (e) {
          return String(arg);
        }
      }
      return String(arg);
    }).join(' ');

    logs.push({
      timestamp: new Date().toLocaleTimeString('de-DE'),
      level: level,
      message: message,
      url: window.location.href
    });

    renderLogs();
    updateStats();
  }

  console.log = function(...args) {
    originalLog.apply(console, args);
    addLog('LOG', ...args);
  };

  console.error = function(...args) {
    originalError.apply(console, args);
    addLog('ERROR', ...args);
  };

  console.warn = function(...args) {
    originalWarn.apply(console, args);
    addLog('WARN', ...args);
  };

  // Capture redirects
  const origReplace = window.location.replace;
  window.location.replace = function(url) {
    addLog('REDIRECT', `→ ${url}`);
    origReplace.call(window.location, url);
  };

  const origHref = Object.getOwnPropertyDescriptor(window.location, 'href');
  Object.defineProperty(window.location, 'href', {
    get: origHref.get,
    set: function(url) {
      addLog('REDIRECT', `→ ${url}`);
      origHref.set.call(window.location, url);
    }
  });

  // Capture localStorage
  const origSetItem = Storage.prototype.setItem;
  Storage.prototype.setItem = function(key, value) {
    if (key.includes('_planTransfer') || key.includes('pb_')) {
      const shortVal = value.length > 50 ? value.substring(0, 50) + '...' : value;
      addLog('STORAGE', `localStorage.setItem("${key}", "${shortVal}")`);
    }
    origSetItem.call(this, key, value);
  };

  // Capture errors
  window.addEventListener('error', (event) => {
    addLog('ERROR', `Uncaught: ${event.message} (${event.filename}:${event.lineno})`);
  });

  window.addEventListener('unhandledrejection', (event) => {
    addLog('ERROR', `Unhandled Promise: ${event.reason}`);
  });

  function renderLogs() {
    const container = document.getElementById('logsContainer');
    const filterLog = document.getElementById('filterLog').checked;
    const filterError = document.getElementById('filterError').checked;
    const filterWarn = document.getElementById('filterWarn').checked;
    const filterRedirect = document.getElementById('filterRedirect').checked;

    container.innerHTML = logs.reverse().map(log => {
      if (log.level === 'LOG' && !filterLog) return '';
      if (log.level === 'ERROR' && !filterError) return '';
      if (log.level === 'WARN' && !filterWarn) return '';
      if (log.level === 'REDIRECT' && !filterRedirect) return '';

      return `
        <div class="log-entry ${log.level}">
          <span class="timestamp">[${log.timestamp}]</span>
          <span class="level">${log.level}</span>
          ${log.message}
        </div>
      `;
    }).join('');
  }

  function updateStats() {
    document.getElementById('logCount').textContent = logs.length;
    document.getElementById('errorCount').textContent = logs.filter(l => l.level === 'ERROR').length;
    document.getElementById('warnCount').textContent = logs.filter(l => l.level === 'WARN').length;
    document.getElementById('redirectCount').textContent = logs.filter(l => l.level === 'REDIRECT').length;
  }

  function clearLogs() {
    logs.length = 0;
    renderLogs();
    updateStats();
  }

  function copyToClipboard() {
    const text = logs.map(l => `[${l.timestamp}] [${l.level}] ${l.message}`).join('\n');
    navigator.clipboard.writeText(text);
    alert('Logs kopiert!');
  }

  function downloadLogs() {
    const text = logs.map(l => `[${l.timestamp}] [${l.level}] ${l.message}`).join('\n');
    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `crewplaner-debug-${new Date().getTime()}.log`;
    a.click();
  }

  // Filter listeners
  document.getElementById('filterLog').addEventListener('change', renderLogs);
  document.getElementById('filterError').addEventListener('change', renderLogs);
  document.getElementById('filterWarn').addEventListener('change', renderLogs);
  document.getElementById('filterRedirect').addEventListener('change', renderLogs);

  console.log('%c🔍 Crewplaner Debug Dashboard aktiv', 'color: #e8c84a; font-size: 14px; font-weight: bold;');
  console.log('Alle console.log, errors, redirects und localStorage-Zugriffe werden getracked!');
</script>

</body>
</html>
